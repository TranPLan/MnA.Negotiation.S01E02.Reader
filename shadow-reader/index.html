ông.\nNhưng khi vào thị trường Trung Đông, họ nhận ra xây dựng căn hộ là một lĩnh vực tiềm năng.\nVậy nên họ đã thử xây chung cư.\nNhưng kết quả không tốt lắm.\nXây dựng chung cư rất khác với công trình dân dụng.\nĐúng vậy. Nhưng CEO của họ rất quyết tâm.","ko":"강상배: 저희는 M&A에서 인수회사와 인수대...\n강상배: 아니다. 그냥 저기 이사하실 때 부동산 같은 거라고 생각하시면 돼요.\n강상배: 일단 티저는 다 돌렸는데 저희가 주목하는 회사는 두 군데입니다.\n강상배: 먼저, 참옥건설.\n강상배: 같은 건설사이긴 하지만 여기 주력 분야는 토목입니다.\n강상배: 최근에 난지대교 건설에 참여했었고 중동에도 진출을 했고요.\n강상배: 그런데 중동을 가보니까 아파트를 성장 분야로 판단했던 것 같아요.\n강상배: 그래서 아파트 건설을 시도했겠죠. 성과가 안 좋았습니다.\n오순영: 여기랑 아파트는 다르지.\n강상배: 다르죠. 그래도 여기 대표님의 의지가 확실한 것 같더라고요.","en":"In an M&A, we deal with the acquiring company and the target— Yumin IB, Never mind.\nThink of it like a real estate agency when you move.\nWe promoted the teaser everywhere,\nbut we're focusing on two companies.\nFirst, it's Chamok Construction.\nIt's also a construction company, but their main focus is civil engineering.\nThey recently worked on the Nanji Bridge and expanded into the Middle East.\nBut when they went to the Middle East, they saw apartment construction as a growth area.\nSo they probably tried building apartments.\nBut the results weren't good.\nBuilding apartments is different than engineering.\nIt's different. Still, the CEO is quite determined.","text":"Trong một thương vụ M&A, chúng tôi làm việc với\ncông ty mua lại và công ty mục tiêu... thôi bỏ đi.\nMọi người cứ hiểu đơn giản là đó công ty môi giới bất động sản khi mọi người chuyển nhà.\nChúng ta đã quảng bá dự án khắp nơi, nhưng hiện tại tập trung vào hai công ty.\nĐầu tiên, là Công ty Xây dựng Chamok.\nHọ cũng là một công ty xây dựng, nhưng trọng tâm chính là công trình dân dụng.\nGần đây họ đã thực hiện dự án Cầu Nanji, và mở rộng sang Trung Đông.\nNhưng khi vào thị trường Trung Đông, họ nhận ra xây dựng căn hộ là một lĩnh vực tiềm năng.\nVậy nên họ đã thử xây chung cư.\nNhưng kết quả không tốt lắm.\nXây dựng chung cư rất khác với công trình dân dụng.\nĐúng vậy. Nhưng CEO của họ rất quyết tâm.\\n강상배: 저희는 M&A에서 인수회사와 인수대...\n강상배: 아니다. 그냥 저기 이사하실 때 부동산 같은 거라고 생각하시면 돼요.\n강상배: 일단 티저는 다 돌렸는데 저희가 주목하는 회사는 두 군데입니다.\n강상배: 먼저, 참옥건설.\n강상배: 같은 건설사이긴 하지만 여기 주력 분야는 토목입니다.\n강상배: 최근에 난지대교 건설에 참여했었고 중동에도 진출을 했고요.\n강상배: 그런데 중동을 가보니까 아파트를 성장 분야로 판단했던 것 같아요.\n강상배: 그래서 아파트 건설을 시도했겠죠. 성과가 안 좋았습니다.\n오순영: 여기랑 아파트는 다르지.\n강상배: 다르죠. 그래도 여기 대표님의 의지가 확실한 것 같더라고요.\\nIn an M&A, we deal with the acquiring company and the target— Yumin IB, Never mind.\nThink of it like a real estate agency when you move.\nWe promoted the teaser everywhere,\nbut we're focusing on two companies.\nFirst, it's Chamok Construction.\nIt's also a construction company, but their main focus is civil engineering.\nThey recently worked on the Nanji Bridge and expanded into the Middle East.\nBut when they went to the Middle East, they saw apartment construction as a growth area.\nSo they probably tried building apartments.\nBut the results weren't good.\nBuilding apartments is different than engineering.\nIt's different. Still, the CEO is quite determined.","koRange":{"start":1628.04,"end":1670.85},"viRange":{"start":1656.272524,"end":1701.773857},"start":1628.04,"end":1701.773857,"koSentenceMarks":[],"koShadowSegments":[{"index":0,"start":null,"end":null,"text":"저희는 M&A에서 인수회사와 인수대...","speed":1,"cueUid":"merged-mvryj9ql-14","speakerIds":["NEG-023"],"speakerNames":["강상배"],"speakerLabel":"강상배:  "},{"index":1,"start":null,"end":null,"text":"아니다. 그냥 저기 이사하실 때 부동산 같은 거라고 생각하시면 돼요.","speed":1,"cueUid":"merged-mvryj9ql-14","speakerIds":["NEG-023"],"speakerNames":["강상배"],"speakerLabel":"강상배:  "},{"index":2,"start":null,"end":null,"text":"일단 티저는 다 돌렸는데 저희가 주목하는 회사는 두 군데입니다.","speed":1,"cueUid":"merged-mvryj9ql-14","speakerIds":["NEG-023"],"speakerNames":["강상배"],"speakerLabel":"강상배:  "},{"index":3,"start":null,"end":null,"text":"먼저, 참옥건설.","speed":1,"cueUid":"merged-mvryj9ql-14","speakerIds":["NEG-023"],"speakerNames":["강상배"],"speakerLabel":"강상배:  "},{"index":4,"start":null,"end":null,"text":"같은 건설사이긴 하지만 여기 주력 분야는 CFO:  "}]},{"id":263,"cueNo":264,"displayNo":264,"sourceUid":"merged-mvs8lq13-7","uid":"merged-mvs8lq13-7","originalCueNo":264,"vi":"Nhưng chúng ta không thể mãi sử dụng thương hiệu của họ.\nKhi đổi tên,\nchúng ta phải cân nhắc sự sụt giảm giá trị thương hiệu.\nTuy nhiên, nếu muốn tham gia dự án Yongsan,\nchúng ta cần một công ty xây dựng.\nNhưng CEO của Xây dựng thế nào?","ko":"비움임원: 근데 그 브랜드를 그대로 이용하기는 어렵잖아요.\n비움임원: 한 이름을 바꾸면 그만큼 브랜드 가치도 떨어지는 걸 감안해야죠.\n비움CFO: 그래도 용산 프로젝트에 들어가려면 건설이 필요하죠.\n지연우: 근데 산인건설 거기 대표는 어때요?","en":"But we can't just keep using their brand.\nWhen we change the name,\nwe should consider the drop in brand value.\nStill, if we want to join the Yongsan project,\nwe need a construction company.\nBut how is the CEO of Sanin Construction?","text":"Nhưng chúng ta không thể mãi sử dụng thương hiệu của họ.\nKhi đổi tên,\nchúng ta phải cân nhắc sự sụt giảm giá trị thương hiệu.\nTuy nhiên, nếu muốn tham gia dự án Yongsan,\nchúng ta cần một công ty xây dựng.\nNhưng CEO của Xây dựng thế nào?\\n비움임원: 근데 그 브랜드를 그대로 이용하기는 어렵잖아요.\n비움임원: 한 이름을 바꾸면 그만큼 브랜드 가치도 떨어지는 걸 감안해야죠.\n비움CFO: 그래도 용산 프로젝트에 들어가려면 건설이 필요하죠.\n지연우: 근데 산인건설 거기 대표는 어때요?\\nBut we can't just keep using their brand.\nWhen we change the name,\nwe should consider the drop in brand value.\nStill, if we want to join the Yongsan project,\nwe need a construction company.\nBut how is the CEO of Sanin Construction?","koRange":{"start":1767.25,"end":1784.13},"viRange":{"start":1797.748887,"end":1813.5881},"start":1767.25,"end":1813.5881,"koSentenceMarks":[0],"koShadowSegments":[{"index":0,"start":null,"end":null,"text":"근데 그 브랜드를 그대로 이용하기는 어렵잖아요.","speed":1,"cueUid":"merged-mvs8lq13-7","speakerIds":["sp-mvs8f7av-3"],"speakerNames":["비움임원"],"speakerLabel":"비움임원:  "},{"index":1,"start":null,"end":null,"text":"한 이름을 바꾸면 그만큼 브랜드 가치도 떨어지는 걸 감안해야죠.","speed":1,"cueUid":"merged-mvs8lq13-7","speakerIds":["sp-mvs8f7av-3"],"speakerNames":["비움임원"],"speakerLabel":"비움임원:  "},{"index":2,"start":null,"end":null,"text":"그래도 용 ","ko":"이동준: 우리 건설이 7조라고?\n윤주노: 네. 6조 5천 정도로 보고 있지만 7조까지는 가능할 것 같습니다.\n이동준: 설득은 해보겠지만 사람들 앞에서 두 자리라 얘기하셨으니\n이동준: 실제로는 어렵지 싶어\n윤주노: 네?\n이동준: 그렇다고 팔지 말라는 것도 아닐 거네","en":"You said our Construction is worth 7 trillion won?\nYes. It's estimated at 6.5 trillion, but I think it's possible to get up to 7 trillion.\nI'll try to persuade him, but he said double digits in front of everyone, so he probably won't agree to 7 trillion won.\nI see.\nBut I don't think he means not to sell it.","text":"Cậu nói Công ty Xây dựng của chúng ta trị giá 7 nghìn tỷ won sao?\nĐúng vậy. Hiện được ước tính khoảng 6,5 nghìn tỷ,\nnhưng tôi nghĩ có thể đẩy lên tới 7 nghìn tỷ.\nTôi sẽ cố gắng thuyết phục ông ấy, nhưng ông ấy đã tuyên bố con số hai chữ số trước mặt mọi người, \nnên có lẽ sẽ không đồng ý với mức 7 nghìn tỷ won đâu.\nTôi hiểu rồi.\nNhưng tôi không nghĩ ông ấy có ý định không bán nó.\\n이동준: 우리 건설이 7조라고?\n윤주노: 네. 6조 5천 정도로 보고 있지만 7조까지는 가능할 것 같습니다.\n이동준: 설득은 해보겠지만 사람들 앞에서 두 자리라 얘기하셨으니\n이동준: 실제로는 어렵지 싶어\n윤주노: 네?\n이동준: 그렇다고 팔지 말라는 것도 아닐 거네\\nYou said our Construction is worth 7 trillion won?\nYes. It's estimated at 6.5 trillion, but I think it's possible to get up to 7 trillion.\nI'll try to persuade him, but he said double digits in front of everyone, so he probably won't agree to 7 trillion won.\nI see.\nBut I don't think he means not to sell it.","koRange":{"start":1969.3,"end":1995.17},"viRange":{"start":1996.487268,"end":2025.599268},"start":1969.3,"end":2025.599268,"koSentenceMarks":[0],"koShadowSegments":[{"index":0,"start":null,"end":null,"text":"우리 건설이 7조라고?","speed":1,"cueUid":"merged-mvsy8eno-13","speakerIds":["NEG-007"],"speakerNames":["이동준"],"speakerLabel":"이동준:  "},{"index":1,"start":null,"end":null,"text":"네. 6조 5천 정도로 보고 있지만 7조까지는 가능할 것 같습니다.","speed":1,"cueUid":"merged-mvsy8eno-13","speakerIds":["NEG-001"],"speakerNames":["윤주노"],"speakerLabel":"윤주노:  "},{"index":2,"start":null,"end":null,"text":"설득은 해보겠지만 사람들 앞에서 두 자리라 얘기하셨으니","speed":1,"cueUid":"merged-mvsy8eno-13","spea 머니신데요. 그 내에분 할아버지의 묘였습니다.\n한기자: 불법이죠 아마?","en":"Yes, it's a heartwarming story.\nThey resolved a redevelopment issue that stalled\nunder Sanin Construction during the acquisition.\nWhat was the issue?\nA resident dug a gravesite behind the apartment.\nThat resident was an elderly lady,\nand it was her late husband's gravesite.\nThat's probably illegal, right?","text":"Đúng, đây là một câu chuyện ấm lòng.\nHọ đã giải quyết một vấn đề tái phát triển bị đình trệ\ndưới thời Xây dựng Sanin trong quá trình mua lại này.\nĐó là vấn đề gì vậy?\nMột cư dân đã đào một chỗ chôn cất sau khu chung cư.\nCư dân đó là một bà lão,\nvà đó là nơi chôn cất của người chồng quá cố của bà.\nChuyện đó hẳn là phạm pháp, đúng không?\\n한기자: 네요. 비움DNI는 이를 통해 아파트 건설에 본격적으로 뛰어들 전망입니다.\n한기자: 네. 훈훈한 소식인데요. 산인건설에서 진행하다가 막혔던 재건축 사업을 비움DNI가 인수하면서 해결했습니다.\n한기자: 어떤 문제였습니까?\n한기자: 주민 아파트 뒷산에 묘를 썼던 겁니다. 주민분이 할머니신데요. 그 내에분 할아버지의 묘였습니다.\n한기자: 불법이죠 아마?\\nYes, it's a heartwarming story.\nThey resolved a redevelopment issue that stalled\nunder Sanin Construction during the acquisition.\nWhat was the issue?\nA resident dug a gravesite behind the apartment.\nThat resident was an elderly lady,\nand it was her late husband's gravesite.\nThat's probably illegal, right?","koRange":{"start":4216.72,"end":4244.07},"viRange":{"start":4254.37713,"end":4274.638464},"start":4216.72,"end":4274.638464,"koSentenceMarks":[0],"koShadowSegments":[{"index":0,"start":null,"end":null,"text":"네요. 비움DNI는 이를 통해 아파트 건설에 본격적으로 뛰어들 전망입니다.","speed":1,"cueUid":"merged-mvv3tn8n-9","speakerIds":["sp-mvv0ep0t-8"],"speakerNames":["한기자"],"speakerLabel":"한기자:  "},{"index":1,"start":null,"end":null,"text":"네. 훈훈한 소식인데요. 산인건설에서 진행하다가 막혔던 재건축 사업을 비움DNI가 인수하면서 해결했습니다.","speed":1,"cueUid":"merged-mvv3tn8n-9","speakerIds":["sp-mvv0ep0t-8"],"speakerNames":["한기자"],"speakerLabel":"한기자:  "},{"index":2,"start":null,"end":null,"text":"어떤 문제였습니까?","speed":1,"cueUid":"merged-mvv3tn8n-9","speakerIds":["sp-mvv0ep0t-8"],"speakerNames":["한기자"],"speakerLabel":"한기자 function cueBox(m,i){const t=trackOf(m),title=m.title||t.title||'OST',start=Number(m.start)||0,end=Number(m.end)||0;let lines=['ko','vi','en'].filter(k=>clean(m[k]).trim()).map(k=>'<div class="ostCueLyrics"><b>'+({ko:'🇰🇷 KO',vi:'🇻🇳 VI',en:'🇬🇧 EN'}[k])+'</b>'+escapeHtml(m[k])+'</div>').join('');return '<div class="ostCueBox" onclick="event.stopPropagation()"><div class="ostCueHead">🎵 OST · '+escapeHtml(title)+'</div><div class="ostCueMeta">'+start.toFixed(3)+'s → '+end.toFixed(3)+'s</div><button class="ostCueBtn" onclick="ostCuePlay('+i+')">▶ Play OST</button><details><summary>📜 Xem lời bài hát'+(lines?'':' (chưa có Lyrics)')+'</summary>'+lines+'</details></div>';}
const orig=render;
render=function(){const result=orig.apply(this,arguments);const arr=project.blocks||project.items||[];const list=get('list');if(list){const selector=Array.isArray(project.blocks)?'.seg':'.cue';const nodes=list.querySelectorAll(selector);nodes.forEach(node=>{const match=node.getAttribute('onclick')||'',found=match.match(/cur\s*=\s*(\d+)/);let i=found?Number(found[1]):null;if(i===null&&node.id&&/^cue-\d+$/.test(node.id))i=Number(node.id.slice(4));if(i===null)return;const m=cueMusic(arr[i]);if(m){const box=document.createElement('div');box.innerHTML=cueBox(m,i);node.appendChild(box.firstElementChild);}});}return result;};
const top=document.querySelector('.top')||document.body;const bar=document.createElement('div');bar.style.cssText='background:#faf5ff;border:1px solid #ddd6fe;border-radius:12px;padding:8px;margin:6px 0';bar.innerHTML='<b>🎵 OST Player</b> <span id="ostCueStatus" class="ostCueStatus">Chọn Play OST tại cue có nhạc</span><div id="ostCueAudioHost"></div><label style="display:block;font-size:12px">Nếu GitHub chưa có nhạc: <input class="ostCueFile" type="file" accept="audio/*" onchange="ostCueLoadFile(this)"></label>';top.appendChild(bar);get('ostCueAudioHost').appendChild(audio);render();
})();</script></body></html>
