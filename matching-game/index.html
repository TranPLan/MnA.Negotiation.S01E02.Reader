27,"originalSourceNo":282,"displayNo":227,"vi":"Lòng tham của Chủ tịch khi về già thật đáng sợ.","ko":"최동규: 와 그 회장님 노역이 무섭네요","en":"The Chairman's greed in his old age is scary.","start":1512.51,"end":1515.44,"viStart":1543.008126,"viEnd":1545.665988,"koStart":1512.51,"koEnd":1515.44,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1543.008126,"end":1545.665988},"koRange":{"start":1512.51,"end":1515.44}},{"id":228,"sourceUid":"merged-mvruciph-9","sourceNo":228,"originalSourceNo":283,"displayNo":228,"vi":"Ông ấy thực chất đang nói là đừng bán nó đi.\nYoon Joo No nói với mọi người rằng\ncông ty sẽ sụp đổ nếu không bán mảng Xây dựng.","ko":"하태수: 팔지 마라 소리지 이 사람아\n하태수: 윤준호가 건설 안 팔면 회사 망한다고 사람들 다 있는 데서 그렇게 떠들어대는데","en":"He's basically saying not to sell it.\nYun Ju No was telling everyone that the company will go under if we don't sell Construction.","start":1515.19,"end":1522.82,"viStart":1545.665988,"viEnd":1552.504879,"koStart":1515.19,"koEnd":1522.82,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1545.665988,"end":1552.504879},"koRange":{"start":1515.19,"end":1522.82}},{"id":229,"sourceUid":"merged-mvrvaiwn-1","sourceNo":229,"originalSourceNo":285,"displayNo":229,"vi":"Vậy nên Chủ tịch không thể nói thẳng là đừng bán.","ko":"하태수: 회장님이 거기서 팔지 마 이럴 수 없는 거 아니야","en":"So the chairman can't say not to sell it there.","start":1522.57,"end":1525.6,"viStart":1552.504879,"viEnd":1555.243546,"koStart":1522.57,"koEnd":1525.6,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1552.504879,"end":1555.243546},"koRange":{"start":1522.57,"end":1525.6}},{"id":230,"sourceUid":"merged-mvrvbgk2-2","sourceNo":230,"originalSourceNo":286,"displayNo":230,"vi":"À, đúng thật.\nVề cơ bản, Chủ tịch đang ám chỉ đừng bán.","ko":"최동규: 아 그쵸 회장님이 팔지 말라는 거죠","en":"Oh, that's true.\nThe chairman is basically saying not to sell it.","start":1525.35,"end":1529.14,"viStart":1555.243546,"viEnd":1559.664879,"koStart":1525.35,"koEnd":1529.14,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1555.243546,"end":1559.664879},"koRange":{"start":1525.35,"end":1529.14}},{"id":231,"sourceUid":"merged-mvrvccc4-3","sourceNo":231,"originalSourceNo":287,"displayNo":231,"vi":"Mảng Xây dựng là nguồn thu chính của chúng ta.\nTrong tình huống này, bán nó đi là điều vô lý.","ko":"조이사: 건설의 알짜배기인데 말이 안되면 소리지어 이 상황에서","en":"Construction is our main stream of revenue.\nIt makes no sense whatsoever in this situation.","start":1528.89,"end":1533.14,"viStart":1559.664879,"viEnd":1563.424879,"koStart":1528.89,"koEnd":1533.14,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1559.664879,"end":1563.424879},"koRange":{"start":1528.89,"end":1533.14}},{"id":232,"sourceUid":"merged-mvrvewiu-6","sourceNo":232,"originalSourceNo":291,"displayNo":232,"vi":"Điều đó là đương nhiên,\nnhưng Chủ tịch vốn xuất thân từ ngành xây dựng.\nTừ thời trẻ, ông ấy đã muốn xây dựng chung cư.\nĐó là ước mơ của ông ấy.","ko":"하태수: 그것도 그건데\n하태수: 회장님이 원래 세면빵 먹던 출신 아니야.\n하태수: 젊을 때부터 아파트 짓겠다고.\n하태수: 그게 꾸민 양반이었다니까.","en":"That's true,\nbut the chairman originally came from construction.\nSince his youth, he wanted to build apartments.\nThat was his dream.","start":1532.89,"end":1544.12,"viStart":1563.424879,"viEnd":1573.654213,"koStart":1532.89,"koEnd":1544.12,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1563.424879,"end":1573.654213},"koRange":{"start":1532.89,"end":1544.12}},{"id":233,"sourceUid":"merged-mvrvfkqt-7","sourceNo":233,"originalSourceNo":292,"displayNo":233,"vi":"À, đúng rồi.\nYoon Joo No đang cố bán đi ước mơ của Chủ tịch.","ko":"최동규: 아 그죠.\n최동규: 지금 윤준호가 회장님 꿈을 바라먹겠다는 거네요.","en":"Oh, right.\nYun Ju No is trying to sell the chairman's dream.","start":1544.15,"end":1549.48,"viStart":1573.654213,"viEnd":1578.422,"koStart":1544.15,"koEnd":1549.48,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1573.654213,"end":1578.422},"koRange":{"start":1544.15,"end":1549.48}},{"id":234,"sourceUid":"merged-mvrvhg7z-10","sourceNo":234,"originalSourceNo":298,"displayNo":234,"vi":"Một người già không thể quên quá khứ của mình.\nĐó là tất cả những gì ông ấy có. Sao có thể quên được?\nDù mảng Xây dựng từng rất yếu kém,\ntôi đã biến nó thành công ty hàng đầu bằng cách mua lại Yongah E&C.","ko":"하태수: 노인은 과거를 못 잊어요.\n하태수: 그게 전부인데.\n하태수: 어떻게 했나.\n하태수: 건설도 그 뭐 비리비리 하던 거를.\n하태수: 내가 융화 ENC 사오면서 그게 넘버원 된 건데 그게.","en":"An old man can't forget his past.\nIt's all he has. How could he forget?\nThough Construction was once feeble,\nI made it the top company by acquiring Yongah E&C.","start":1551.47,"end":1562.86,"viStart":1578.422,"viEnd":1593.862213,"koStart":1551.47,"koEnd":1562.86,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1578.422,"end":1593.862213},"koRange":{"start":1551.47,"end":1562.86}},{"id":235,"sourceUid":"merged-mvrvjkaf-12","sourceNo":235,"originalSourceNo":300,"displayNo":235,"vi":"Đúng vậy.\nĐó là lý do Chủ tịch rất quý trọng Giám đốc Ha.","ko":"박태호: 그럼요.\n박태호: 아 그래서 회장님이 우리 전부님을 아끼시는 거죠","en":"Yes, you're right.\nThat's why the chairman loves you, Mr. Ha.","start":1563.27,"end":1568.38,"viStart":1593.862213,"viEnd":1597.643546,"koStart":1563.27,"koEnd":1568.38,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1593.862213,"end":1597.643546},"koRange":{"start":1563.27,"end":1568.38}},{"id":236,"sourceUid":"merged-mvrvkcgh-14","sourceNo":236,"originalSourceNo":302,"displayNo":236,"vi":"Chẳng phải ai đó nên nói với Tổ trưởng Yoon\nrằng Chủ tịch không muốn điều đó sao?","ko":"최동규: 인신장한테 그 누구 알려주지 않을까요?\n최동규: 회장님 뜻이 그게 아니라","en":"Wouldn't someone tell Mr. Yun that the chairman doesn't want that?","start":1570.42,"end":1574.05,"viStart":1597.643546,"viEnd":1604.11288,"koStart":1570.42,"koEnd":1574.05,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1597.643546,"end":1604.11288},"koRange":{"start":1570.42,"end":1574.05}},{"id":237,"sourceUid":"merged-mvrvlirc-16","sourceNo":237,"originalSourceNo":305,"displayNo":237,"vi":"Đã quá muộn rồi.\nKhoảnh khắc cậu ta tuyên bố sẽ bán mảng Xây dựng,\nmọi chuyện coi như chấm dứt.","ko":"하태수: 늦었 i và công ty mục tiêu... thôi bỏ đi.\nMọi người cứ hiểu đơn giản là đó công ty môi giới bất động sản khi mọi người chuyển nhà.\nChúng ta đã quảng bá dự án khắp nơi, nhưng hiện tại tập trung vào hai công ty.\nĐầu tiên, là Công ty Xây dựng Chamok.\nHọ cũng là một công ty xây dựng, nhưng trọng tâm chính là công trình dân dụng.\nGần đây họ đã thực hiện dự án Cầu Nanji, và mở rộng sang Trung Đông.\nNhưng khi vào thị trường Trung Đông, họ nhận ra xây dựng căn hộ là một lĩnh vực tiềm năng.\nVậy nên họ đã thử xây chung cư.\nNhưng kết quả không tốt lắm.\nXây dựng chung cư rất khác với công trình dân dụng.\nĐúng vậy. Nhưng CEO của họ rất quyết tâm.","ko":"강상배: 저희는 M&A에서 인수회사와 인수대...\n강상배: 아니다. 그냥 저기 이사하실 때 부동산 같은 거라고 생각하시면 돼요.\n강상배: 일단 티저는 다 돌렸는데 저희가 주목하는 회사는 두 군데입니다.\n강상배: 먼저, 참옥건설.\n강상배: 같은 건설사이긴 하지만 여기 주력 분야는 토목입니다.\n강상배: 최근에 난지대교 건설에 참여했었고 중동에도 진출을 했고요.\n강상배: 그런데 중동을 가보니까 아파트를 성장 분야로 판단했던 것 같아요.\n강상배: 그래서 아파트 건설을 시도했겠죠. 성과가 안 좋았습니다.\n오순영: 여기랑 아파트는 다르지.\n강상배: 다르죠. 그래도 여기 대표님의 의지가 확실한 것 같더라고요.","en":"In an M&A, we deal with the acquiring company and the target— Yumin IB, Never mind.\nThink of it like a real estate agency when you move.\nWe promoted the teaser everywhere,\nbut we're focusing on two companies.\nFirst, it's Chamok Construction.\nIt's also a construction company, but their main focus is civil engineering.\nThey recently worked on the Nanji Bridge and expanded into the Middle East.\nBut when they went to the Middle East, they saw apartment construction as a growth area.\nSo they probably tried building apartments.\nBut the results weren't good.\nBuilding apartments is different than engineering.\nIt's different. Still, the CEO is quite determined.","start":1628.04,"end":1670.85,"viStart":1656.272524,"viEnd":1701.773857,"koStart":1628.04,"koEnd":1670.85,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1656.272524,"end":1701.773857},"koRange":{"start":1628.04,"end":1670.85}},{"id":245,"sourceUid":"merged-mvrz79ls-21","sourceNo":245,"originalSourceNo":336,"displayNo":245,"vi":"Mấy tên Sanin này tuyệt vọng đến mức nào\n[Cha Myeong Hwan]\nmới phải bán đi mảng Xây dựng chứ?","ko":"차목대표: 산인 새끼들 얼마나 똥줄이 탔으면 건설을 팔지?","en":"[Cha Myeong Hwan]\nHow desperate are these jerks at Sanin that they'd sell Construction?","start":1673.84,"end":1679.77,"viStart":1701.773857,"viEnd":1710.510764,"koStart":1673.84,"koEnd":1679.77,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1701.773857,"end":1710.510764},"koRange":{"start":1673.84,"end":1679.77}},{"id":246,"sourceUid":"merged-mvrz5d4p-20","sourceNo":246,"originalSourceNo":337,"displayNo":246,"vi":"Tập đoàn của họ hình như đang gặp vấn đề tài chính.","ko":"차목CFO: 그룹의 자금 문제가 좀 있는 것 같더라고요","en":"The group seems to have some funding issues.","start":1680.42,"end":1682.71,"viStart":1710.510764,"viEnd":1712.608276,"koStart":1680.42,"koEnd":1682.71,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1710.510764,"end":1712.608276},"koRange":{"start":1680.42,"end":1682.71}},{"id":247,"sourceUid":"merged-mvrz7ve8-22","sourceNo":247,"originalSourceNo":338,"displayNo":247,"vi":"Vậy thì, cố gắng hạ giá xuống.","ko":"차목대표: 그러면 가격을 좀 후려쳐봐요","en":"Then try to lower the price.","start":1682.46,"end":1685.23,"viStart":1712.608276,"viEnd":1714.767151,"koStart":1682.46,"koEnd":1685.23,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1712.608276,"end":1714.767151},"koRange":{"start":1682.46,"end":1685.23}},{"id":248,"sourceUid":"merged-mvrz8kbv-23","sourceNo":248,"originalSourceNo":339,"displayNo":248,"vi":"CEO, đây là một cuộc đấu giá.","ko":"차목임원: 대표님, 이게 입찰 방식으로 진행되는 거라서요","en":"CEO, it's being sold in an auction.","start":1686.32,"end":1689.45,"viStart":1714.767151,"viEnd":1718.838982,"koStart":1686.32,"koEnd":1689.45,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1714.767151,"end":1718.838982},"koRange":{"start":1686.32,"end":1689.45}},{"id":249,"sourceUid":"merged-mvrz98db-24","sourceNo":249,"originalSourceNo":340,"displayNo":249,"vi":"Nếu chúng ta bỏ lỡ, sẽ tổn thất rất lớn...","ko":"차목임원: 놓치면 너무 아까운데 저희가...","en":"It'd be a major loss if we missed out. If we...","start":1689.2,"end":1691.93,"viStart":1718.838982,"viEnd":1721.430347,"koStart":1689.2,"koEnd":1691.93,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1718.838982,"end":1721.430347},"koRange":{"start":1689.2,"end":1691.93}},{"id":250,"sourceUid":"merged-mvrzbe2l-1","sourceNo":250,"originalSourceNo":341,"displayNo":250,"vi":"Vâng, tôi sẽ cố gắng thương lượng giá thấp hơn.","ko":"차목CFO: 네, 제가 이번에 제대로 후려치겠습니다","en":"Yes. I'll make sure to lower the price.","start":1691.68,"end":1694.25,"viStart":1721.430347,"viEnd":1724.030347,"koStart":1691.68,"koEnd":1694.25,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1721.430347,"end":1724.030347},"koRange":{"start":1691.68,"end":1694.25}},{"id":251,"sourceUid":"merged-mvrzc6q0-2","sourceNo":251,"originalSourceNo":342,"displayNo":251,"vi":"Chắc chắn Chamok sẽ tham gia đấu giá.","ko":"강상배: 사목이 입찰에 응할 것은 거의 분명해 보이고","en":"It's almost certain Chamok will enter the auction.","start":1694,"end":1697.95,"viStart":1724.030347,"viEnd":1726.862347,"koStart":1694,"koEnd":1697.95,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1724.030347,"end":1726.862347},"koRange":{"start":1694,"end":1697.95}},{"id":252,"sourceUid":"merged-mvrzcp0m-3","sourceNo":252,"originalSourceNo":343,"displayNo":252,"vi":"Họ cần bắt đầu xây dựng căn hộ ngay,\nnên quy trình sẽ diễn ra suôn sẻ.","ko":"강상배: 지금 바로 아파트 건설에 나서야 하는 입장이라서 과정도 수월할 것 같습니다","en":"They need to start building apartments right away,\nso the process will go smoothly too.","start":1697.7,"end":1702.61,"viStart":1726.862347,"viEnd":1732.36269,"koStart":1697.7,"koEnd":1702.61,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1726.862347,"end":1732.36269},"koRange":{"start":1697.7,"end":1702.61}},{"id":253,"sourceUid":"merged-mvrzd6q8-4","sourceNo":253,"originalSourceNo":344,"displayNo":253,"vi":"Vậy thì tốt.","ko":"윤주노: 좋은데요?","en":"That's great.","start":1702.36,"end":1704.05,"viStart" họ\nđã thử thực hiện một thương vụ M&A với một công ty xây dựng.","ko":"강상배: 다음은 비움 D&I 부동산 회사고요\n강상배: 송도 국제도시 개발을 주도해서 현금을 많이 확보하고 있습니다\n강상배: 그 수익으로 우리도 이제 뭐 건설 한번 진출해 볼까 그런 텐션인 것 같아요\n강상배: 그래서 최근에 모 건설사와 M&A를 진행한 바가 있는데","en":"Next, there's Bium D&I.\nIt's a real estate company that led the Songdo International City development,\nsecuring a lot of cash.\nIt seems they are trying to expand into construction\nusing those profits. That seems to be their intent.\nSo they recently tried an M&A with a construction company.","start":1714.66,"end":1733.07,"viStart":1744.923692,"viEnd":1763.23568,"koStart":1714.66,"koEnd":1733.07,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1744.923692,"end":1763.23568},"koRange":{"start":1714.66,"end":1733.07}},{"id":258,"sourceUid":"merged-mvs7wgrp-4","sourceNo":258,"originalSourceNo":352,"displayNo":258,"vi":"Đó là công ty nào?","ko":"윤주노: 어디를 가셨습니까?","en":"Which company was it?","start":1732.82,"end":1734.83,"viStart":1763.23568,"viEnd":1764.465013,"koStart":1732.82,"koEnd":1734.83,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1763.23568,"end":1764.465013},"koRange":{"start":1732.82,"end":1734.83}},{"id":259,"sourceUid":"merged-mvs7z1mr-5","sourceNo":259,"originalSourceNo":353,"displayNo":259,"vi":"Đây là thông tin không chính thức. Đó là Xây dựng Eboo.","ko":"강상배: 오프더 레코드입니다. 이부건설이요.","en":"This is off the record. It was Eboo Construction.","start":1738.29,"end":1740.56,"viStart":1767.879674,"viEnd":1771.404959,"koStart":1738.29,"koEnd":1740.56,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1767.879674,"end":1771.404959},"koRange":{"start":1738.29,"end":1740.56}},{"id":260,"sourceUid":"merged-mvs822z9-6","sourceNo":260,"originalSourceNo":354,"displayNo":260,"vi":"Tại sao thương vụ này thất bại?\nThông tin này không được công khai nhỉ.","ko":"윤주노: 왜 결렬됐죠?","en":"Why did it fall through?\nOff the record.","start":1741.19,"end":1742.62,"viStart":1771.404959,"viEnd":1775.826292,"koStart":1741.19,"koEnd":1742.62, 12.07,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1940.810892,"end":1941.884885},"koRange":{"start":1910.86,"end":1912.07}},{"id":285,"sourceUid":"merged-mvsww58y-4","sourceNo":285,"originalSourceNo":384,"displayNo":285,"vi":"Tôi đã học được rất nhiều từ anh.","ko":"이동준: 한 수 잘 배웠습니다.","en":"I learned a lot from you.","start":1912.7,"end":1914.25,"viStart":1941.884885,"viEnd":1944.295552,"koStart":1912.7,"koEnd":1914.25,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1941.884885,"end":1944.295552},"koRange":{"start":1912.7,"end":1914.25}},{"id":286,"sourceUid":"merged-mvsx3yy2-7","sourceNo":286,"originalSourceNo":385,"displayNo":286,"vi":"Trời ạ. Anh học từ tôi á?\nKhông, tôi mới là người học từ anh.","ko":"상대: 아이, 참. 배우기는 내가 배웠구만.","en":"No, I learned from you.\nGosh. \"You learned from me\"?","start":1914.88,"end":1918.71,"viStart":1944.295552,"viEnd":1949.303552,"koStart":1914.88,"koEnd":1918.71,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1944.295552,"end":1949.303552},"koRange":{"start":1914.88,"end":1918.71}},{"id":287,"sourceUid":"merged-mvswzlzt-2","sourceNo":287,"originalSourceNo":387,"displayNo":287,"vi":"Tôi tự hỏi liệu Chủ tịch đưa ra giá bán 10 nghìn tỷ\nvì ông ấy không thực sự muốn bán,","ko":"윤주노: 회장님께서 식조에 팔아오라고 하신 게 팔지 말라는 의중이신지 아니면","en":"I was wondering if the chairman said to sell it\nfor 10 trillion because he doesn't want to sell","start":1921.8,"end":1927.57,"viStart":1949.303552,"viEnd":1957.162219,"koStart":1921.8,"koEnd":1927.57,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1949.303552,"end":1957.162219},"koRange":{"start":1921.8,"end":1927.57}},{"id":288,"sourceUid":"merged-mvsx0iqx-3","sourceNo":288,"originalSourceNo":388,"displayNo":288,"vi":"hay vì một lý do nào khác.","ko":"윤주노: 아니면 다른 이유가 있으신지 궁금해서요.","en":"or if there's another reason.","start":1927.32,"end":1931.03,"viStart":1957.162219,"viEnd":1959.952,"koStart":1927.32,"koEnd":1931.03,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1957.162219,"end":1959.952},"koRange":{"start":1927.32,"end":1931.03}},{"id":289,"sourceUid":"merged-mvsx1fa3-4","sourceNo":289,"originalSourceNo":390,"displayNo":289,"vi":"Thế thì sao?\nCậu nghĩ thế nào?","ko":"이동준: 글쎄요? 자네 생각은 어떤데?","en":"Well?\nWhat do you think?","start":1931.3,"end":1935.76,"viStart":1959.952,"viEnd":1965.069,"koStart":1931.3,"koEnd":1935.76,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1959.952,"end":1965.069},"koRange":{"start":1931.3,"end":1935.76}},{"id":290,"sourceUid":"merged-mvsx2l5y-6","sourceNo":290,"originalSourceNo":392,"displayNo":290,"vi":"Tôi không chắc. Nhưng... Tôi nghĩ rằng việc bán công ty xây dựng là hợp lý nhất.","ko":"윤주노: 잘 모르겠습니다.\n윤주노: 다만 건설을 매각하는 게 가장 합리적이라고 생각합니다.","en":"I'm not sure, but...\nI think selling Construction is the most logical.","start":1935.63,"end":1944,"viStart":1965.069,"viEnd":1973.588601,"koStart":1935.63,"koEnd":1944,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1965.069,"end":1973.588601},"koRange":{"start":1935.63,"end":1944}},{"id":291,"sourceUid":"merged-mvsx5vww-9","sourceNo":291,"originalSourceNo":395,"displayNo":291,"vi":"Đúng phong cách của cậu.\nVậy thì chắc cậu không đến gặp tôi vì\ntò mò về ý định của Chủ tịch nhỉ?","ko":"이동준: 자네답네.그럼 날 찾아온 건 회장님 의중이 궁금해서는 아닌가 보네.","en":"That's very like you.\nThen I guess you didn't come to me because\nyou were curious about the chairman's intent.","start":1946.53,"end":1955.27,"viStart":1973.588601,"viEnd":1985.610218,"koStart":1946.53,"koEnd":1955.27,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1973.588601,"end":1985.610218},"koRange":{"start":1946.53,"end":1955.27}},{"id":293,"sourceUid":"merged-mvsx78s4-10","sourceNo":293,"originalSourceNo":396,"displayNo":293,"vi":"Xin hãy thuyết phục Chủ tịch giúp tôi.","ko":"윤주노: 회장님을 설득해 주십시오.","en":"Please persuade the chairman for me.","start":1964.24,"end":1966.07,"viStart":1993.599268,"viEnd":1996.487268,"koStart":1964.24,"koEnd":1966.07,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1993.599268,"end":1996.487268},"koRange":{"start":1964.24,"end":1966.07}},{"id":294,"sourceUid":"merged-mvsy8eno-13","sourceNo":294,"originalSourceNo":402,"displayNo":294,"vi":"Cậu nói Công ty Xây dựng của chúng ta trị giá 7 nghìn tỷ won sao?\nĐúng vậy. Hiện được ước tính khoảng 6,5 nghìn tỷ,\nnhưng tôi nghĩ có thể đẩy lên tới 7 nghìn tỷ.\nTôi sẽ cố gắng thuyết phục ông ấy, nhưng ông ấy đã tuyên bố con số hai chữ số trước mặt mọi người, \nnên có lẽ sẽ không đồng ý với mức 7 nghìn tỷ won đâu.\nTôi hiểu rồi.\nNhưng tôi không nghĩ ông ấy có ý định không bán nó.","ko":"이동준: 우리 건설이 7조라고?\n윤주노: 네. 6조 5천 정도로 보고 있지만 7조까지는 가능할 것 같습니다.\n이동준: 설득은 해보겠지만 사람들 앞에서 두 자리라 얘기하셨으니\n이동준: 실제로는 어렵지 싶어\n윤주노: 네?\n이동준: 그렇다고 팔지 말라는 것도 아닐 거네","en":"You said our Construction is worth 7 trillion won?\nYes. It's estimated at 6.5 trillion, but I think it's possible to get up to 7 trillion.\nI'll try to persuade him, but he said double digits in front of everyone, so he probably won't agree to 7 trillion won.\nI see.\nBut I don't think he means not to sell it.","start":1969.3,"end":1995.17,"viStart":1996.487268,"viEnd":2025.599268,"koStart":1969.3,"koEnd":1995.17,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":1996.487268,"end":2025.599268},"koRange":{"start":1969.3,"end":1995.17}},{"id":295,"sourceUid":"merged-mvsymf7e-2","sourceNo":295,"originalSourceNo":407,"displayNo":295,"vi":"Chủ tịch vốn xuất thân là một quản lý xây dựng.\nVì vậy, ông ấy có tình cảm đặc biệt với nó.\nNhưng giữ lại mảng Xây dựng có thể khiến tập đoàn gặp rủi ro.\nNhưng nếu bán đi, ông ấy sẽ rất buồn.\nÔng ấy vẫn đang giữ phương án đảo ngược quyết định.","ko":"이동준: 회장님이 건설 현장의 관리자로 시작하셨거든\n이동준: 그래서 애착이 크신 거야\n이동준: 그렇다고 건설을 지키자니 그룹이 위태롭고 팔자니 아쉽고\n이동준: 그러니 번복할 수 있는 카드를 쥐고 계신 거지","en":"He started out as a construction manager.\nThat's why he has a strong attachment to it.\nEven though keeping Construction could put the group at risk,\nhe'd be sad to sell it.\nHe's holding the option of reversing the decision.","start":1997.23,"end":2014.26,"viStart":2025.599268,"viEnd":2043.809935,"koStart":1997.23,"koEnd":2014.26,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2025.599268,"end":2043.809935},"koRange":{"start":1997.23,"end":2014.26}},{"id":296,"sourceUid":"merged-mvsyn75s-3","sourceNo":296,"originalSourceNo":408,"displayNo":296,"vi":"Vì khả năng bán được với giá 10 nghìn tỷ là rất thấp.","ko":"윤주노: 10조로 팔릴 리는 만무하니까요","en":"Since it's unlikely to sell for 10 trillion.","start":2014.01,"end":2017.84,"viStart":2043.809935,"viEnd":2047.908602,"koStart":2014.01,"koEnd":2017.84,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2043.809935,"end":2047.908602},"koRange":{"start":2014.01,"end":2017.84}},{"id":297,"sourceUid":"merged-mvsyob8n-4","sourceNo":297,"originalSourceNo":410,"displayNo":297,"vi":"Ừ.\nTôi không có ý gây áp lực cho cậu, nhưng...\nÔng ấy nói sẽ quyết định sau khi xem mức giá.","ko":"이동준: 자네 부담 주려는 건 아니지만\n이동준: 가격을 보고 결정하시겠다는 거지","en":"Indeed.\nI'm not trying to put pressure on you, but...\nhe's saying he'll decide after seeing the price.","start":2021.13,"end":2029.56,"viStart":2047.908602,"viEnd":2059.188602,"koStart":2021.13,"koEnd":2029.56,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2047.908602,"end":2059.188602},"koRange":{"start":2021.13,"end":2029.56}},{"id":298,"sourceUid":"merged-mvsyuem6-7","sourceNo":298,"originalSourceNo":414,"displayNo":298,"vi":"Chủ tịch thích Xây dựng Sanin,\nhay ông ấy coi trọng ngành xây dựng hơn...?\nĐó là vì kiếm tiền bằng chính mồ hôi công sức của mình.","ko":"윤주노: 회장님께서는 산인건설에 대해 애착이 있으신 겁니까?\n윤주노: 아니면 건설이라는 사업 자체에 대해\n이동준: 땀을 흘려서 돈을 버는 것에 대해서\n이동준: 상속하셨나 했는데","en":"Is the chairman fond of Sanin Construction,\nor is it more about the construction industry...\nIt's about making money by the sweat of your brow.","start":2031.13,"end":2051.46,"viStart":2059.188602,"viEnd":2071.948602,"koStart":2031.13,"koEnd":2051.46,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2059.188602,"end":2071.948602},"koRange":{"start":2031.13,"end":2051.46}},{"id":299,"sourceUid":"merged-mvt03i89-9","sourceNo":299,"originalSourceNo":423,"displayNo":299,"vi":"Tôi nghĩ có thể bà đã đến viếng mộ.\nBà đã đi thu thập thùng giấy sao?\nSao bà mang nổi một đống nặng như vậy?\nNếu có thang máy thì tiện hơn rồi.\nAi nói tôi muốn đi thang máy chứ?\nHả?\nNếu anh định nói về tái phát triển thì đi đi!\nĐừng bao giờ quay lại đây!\nTrời ạ, tôi có định nói đâu.","ko":"이정음: 박스모아 오셨어요\n이정음: 엘리베이터에 있으면 편하셨을 텐데\n서춘년: 누가? 엘리베이터 타고 싶대?\n이정음: 네?\n서춘년: 재건축 얘기할 것 같으면 가! 다시 오지마라!\n이정음: 에이 아니네요 아이고","en":"I thought maybe you went to the gravesite.\nDid you gather boxes?\nHow did you bring such a heavy load?\nIt would've been more convenient with an elevator.\nWho said I wanted to ride elevators?\nPardon?\nIf you'll talk about redevelopment, leave!\nDon't ever come back!\nGosh, I wasn't going to.","start":2052.17,"end":2082.31,"viStart":2079.180044,"viEnd":2109.066118,"koStart":2052.17,"koEnd":2082.31,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2079.180044,"end":2109.066118},"koRange":{"start":2052.17,"end":2082.31}},{"id":300,"sourceUid":"merged-mvt04iow-11","sourceNo":300,"originalSourceNo":434,"displayNo":300,"vi":"Ôi trời, ôi không! Anh đang làm gì vậy!\nTôi xin lỗi. Những cái bát quý của tôi!\nAnh chẳng khác nào bọn côn đồ hợp đồng cả, đồ khốn!\nTrời ơi, cứ để đó đi!\nĐi đi! Đi đi!","ko":"서춘년: 이게 뭐하는 짓이야\n서춘년: 아유 귀엽걸. 이 식구 그냥. 그 육육 깡패지 세게. 똑같아 이놈의 새끼. 아유 나도. 그냥. 가 가! 가!","en":"Aigoo, oh no! What are you doing!\nI-I'm sorry. My precious bowls!\nYou're just like contracted thugs, you jerk!\nGosh, just leave it!\nLeave! Leave!","start":2082.06,"end":2094.55,"viStart":2111.436696,"viEnd":2125.103987,"koStart":2082.06,"koEnd":2094.55,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2111.436696,"end":2125.103987},"koRange":{"start":2082.06,"end":2094.55}},{"id":301,"sourceUid":"merged-mvt1mmfe-2","sourceNo":301,"originalSourceNo":439,"displayNo":301,"vi":"Cô bị sốc phải không?\nLà lỗi của tôi. Không đâu.\nBà ấy không thường xuyên la hét như vậy đâu.\nPhó Chủ tịch cũng đến đây để thuyết phục bà ấy sao?\nĐúng vậy.\nNhưng bà ấy đang làm lễ cúng tổ tiên sao?\nNhững cái bát đó là để cúng tổ tiên đấy.\nVậy sao?","ko":"이정음: 안 원하셨죠? 할머니가 원래는 화를 잘 안 내시는데\n이정음: 너 때문에\n곽민정: 아니에요\n곽민정: 무사장님도 할머니 설득하려고 오신 거예요?","en":"You were taken aback, right?\nShe doesn't usually yell like that.\nIt's my fault. N-No.\nDid you come to persuade the grandma as well, VP?\nYes.\nBut is she doing ancestral rites?\nThose were bowls for ancestral rites.\nWere they?","start":2095.56,"end":2109.96,"viStart":2125.103987,"viEnd":2150.743162,"koStart":2095.56,"koEnd":2109.96,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2125.103987,"end":2150.743162},"koRange":{"start":2095.56,"end":2109.96}},{"id":302,"sourceUid":"merged-mvt0980c-17","sourceNo":302,"originalSourceNo":441,"displayNo":302,"vi":"Phụ đề được cung cấp bởi Baedal Minjok","ko":"안녕\n자막 제공 배달의민족","en":"Subtitles provided by Baedal Minjok","start":2130.92,"end":2132.23,"viStart":2130.92,"viEnd":2132.23,"koStart":2130.92,"koEnd":2132.23,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":2130.92,"end":2132.23}},{"id":303,"sourceUid":"merged-mvt1vs66-7","sourceNo":303,"originalSourceNo":442,"displayNo":303,"vi":"Tiền bối. Anh đến rồi. Anh nên ăn gì đó ngon đi.\nMón này là ngon nhất ở Sejong đấy.","ko":"오순영: 맛있는 거 먹지\n주용: 세종에서는 이게 제일 맛있어","en":"Seonbae. You came. You should eat something tasty.\nThis is tastiest in Sejong.","start":2138.7,"end":2144.53,"viStart":2157.248778,"viEnd":2173.958112,"koStart":2138.7,"koEnd":2144.53,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":2157.248778,"end":2173.958112},"koRange":{"start":2138.7,"end":2144.53}},{"id":304,"sourceUid":"merged-mvt1wpxx-8","sourceNo":304,"originalSourceNo":444,"displayNo":304,"vi":"Tôi nghe nói Tổ trưởng Yoon đã trở về.\nỪ","ko":"주용: 윤 팀장 복귀했다며","en":"I hear Mr. Yun came back.\nYes.","start":2145.06,"end":2147.11,"viStart":2173.958112,"viEnd":217 니까?","en":"Will the fees for that also be 530 billion won?","start":3911.82,"end":3914.85,"viStart":3940.957145,"viEnd":3944.573716,"koStart":3911.82,"koEnd":3914.85,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3940.957145,"end":3944.573716},"koRange":{"start":3911.82,"end":3914.85}},{"id":527,"sourceUid":"merged-mvusqb35-19","sourceNo":527,"originalSourceNo":728,"displayNo":527,"vi":"Không.\nTái phát triển thành công là điều mặc định.","ko":"지연우: 아니, 재건축되는 게 디폴트죠","en":"No.\nSuccessful redevelopment is the default.","start":3915.06,"end":3918.89,"viStart":3944.573716,"viEnd":3948.535636,"koStart":3915.06,"koEnd":3918.89,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3944.573716,"end":3948.535636},"koRange":{"start":3915.06,"end":3918.89}},{"id":528,"sourceUid":"merged-mvusqzni-20","sourceNo":528,"originalSourceNo":729,"displayNo":528,"vi":"Nhưng chúng tôi không biết khi nào nó sẽ xảy ra.\nĐó là lý do chúng tôi muốn giảm giá.","ko":"지연우: 근데 그게 언제 될지 알 수 없으니까 깎은 거고요","en":"But we don't know when it'll be.\nThat's why we lowered the price.","start":3918.64,"end":3923.1,"viStart":3948.535636,"viEnd":3952.775413,"koStart":3918.64,"koEnd":3923.1,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3948.535636,"end":3952.775413},"koRange":{"start":3918.64,"end":3923.1}},{"id":529,"sourceUid":"merged-mvusrk8n-21","sourceNo":529,"originalSourceNo":730,"displayNo":529,"vi":"Vậy cô có đồng ý rằng nó cuối cùng sẽ xảy ra không?","ko":"윤주노: 그럼 재건축이 언젠간 된다는 건 동의하시는 거죠?","en":"So you agree it will eventually happen?","start":3922.85,"end":3925.98,"viStart":3952.775413,"viEnd":3955.695636,"koStart":3922.85,"koEnd":3925.98,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":3952.775413,"end":3955.695636},"koRange":{"start":3922.85,"end":3925.98}},{"id":530,"sourceUid":"merged-mvuss0sg-22","sourceNo":530,"originalSourceNo":731,"displayNo":530,"vi":"Vâng, tôi đồng ý.","ko":"지연우: 네, 그건 동의해요","en":"Yes, I agree with that.","start":3926.03,"end":3928.28,"viStart":3 ,"vi":"Đây.","ko":"이정음: 여기로요","en":"Right here.","start":3981.65,"end":3982.66,"viStart":4008.999636,"viEnd":4012.506448,"koStart":3981.65,"koEnd":3982.66,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4008.999636,"end":4012.506448},"koRange":{"start":3981.65,"end":3982.66}},{"id":539,"sourceUid":"merged-mvusyr9b-37","sourceNo":539,"originalSourceNo":745,"displayNo":539,"vi":"Đây là quê của ông nội phải không?","ko":"이정음: 여기가 할아버지 고향 맞으시죠?","en":"This is the grandpa's hometown, right?","start":3986.44,"end":3989.97,"viStart":4015.107798,"viEnd":4018.108969,"koStart":3986.44,"koEnd":3989.97,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4015.107798,"end":4018.108969},"koRange":{"start":3986.44,"end":3989.97}},{"id":540,"sourceUid":"merged-mvut0ot8-2","sourceNo":540,"originalSourceNo":747,"displayNo":540,"vi":"Phải.\nĐây là nơi chúng tôi gặp nhau.","ko":"서춘년: 그래\n서춘년: 나랑 만난 것도 여기였어","en":"Yes.\nThis was where we met.","start":3990.5,"end":3995.25,"viStart":4018.108969,"viEnd":4024.228969,"koStart":3990.5,"koEnd":3995.25,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4018.108969,"end":4024.228969},"koRange":{"start":3990.5,"end":3995.25}},{"id":541,"sourceUid":"merged-mvut20qq-7","sourceNo":541,"originalSourceNo":752,"displayNo":541,"vi":"Con biết mà.\nĐó là lý do mà con tìm kiếm nó ở đây.\nBà nhìn đi, sau này ở đây sẽ có nhiều không gian lắm...","ko":"이정음: 알죠\n이정음: 그래서 찾은 건데요\n이정음: 보시면\n이정음: 자리도 충분해서\n이정음: 나중에","en":"I know.\nThat's why I looked for it here.\nIf you take a look, there's plenty of space so in the future...","start":3995,"end":4004.69,"viStart":4024.228969,"viEnd":4034.274746,"koStart":3995,"koEnd":4004.69,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4024.228969,"end":4034.274746},"koRange":{"start":3995,"end":4004.69}},{"id":542,"sourceUid":"merged-mw3i0c4g-2","sourceNo":542,"originalSourceNo":753,"displayNo":542,"vi":"Sau khi bà chết, con sẽ chôn bà cạnh ông ấy chứ?\nCá nhân con sẽ đảm bảo...\nBà, bà tin con, phải không?\nBạn muốn tôi tin tưởng bạn một lần nữa?","ko":"서춘년: 내가 죽고 나두면 이 곁에 묻어줄 수 있을까?\n이정음: 네. 그건 제가 책임지고 제가... 할머니, 저 믿으시죠?\n서춘년: ...또 믿으라고?","en":"After I die, will you bury me next to him?\nI'll personally make sure to—\nGrandma, you trust me, right?\nYou want me to trust you again?","start":4008.51,"end":4029.180323,"viStart":4034.274746,"viEnd":4059.481406,"koStart":4008.51,"koEnd":4029.180323,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4034.274746,"end":4059.481406},"koRange":{"start":4008.51,"end":4029.180323}},{"id":543,"sourceUid":"merged-mvut6a99-10","sourceNo":543,"originalSourceNo":755,"displayNo":543,"vi":"Nếu chúng tôi lấy được phê duyệt cho các cô trước khi mua lại,\nliệu các cô có xem xét điều đó tương đương với\nsố tiền rủi ro đã được đánh giá là 530 tỷ không?","ko":"윤주노: 그럼 저희가 이수 전에 재건축 승인을 받아들이면 리스크 금액으로 보신 5천 3백억 만큼의 성과로 도 인정해 주시는 건가요","en":"If we get you the approval before the acquisition,\nwill you consider that equivalent to the amount\nof risk assessed, 530 billion?\nThat's already included in the acquisition—","start":4027.38,"end":4039.78,"viStart":4059.481,"viEnd":4070.650997,"koStart":4027.38,"koEnd":4039.78,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4059.481,"end":4070.650997},"koRange":{"start":4027.38,"end":4039.78}},{"id":544,"sourceUid":"merged-mvut8g81-12","sourceNo":544,"originalSourceNo":756,"displayNo":544,"vi":"Điều đó đã bao gồm trong việc mua lại...\nNếu vậy thì...\ntôi sẽ chấp nhận.","ko":"윤주노, 지연우: 그님이 인수 제한가에 포함될 없게 인정해 드릴게요","en":"I will...\naccept it as such.","start":4041.44,"end":4047.11,"viStart":4070.650997,"viEnd":4076.537958,"koStart":4041.44,"koEnd":4047.11,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4070.650997,"end":4076.537958},"koRange":{"start":4041.44,"end":4047.11}},{"id":545,"sourceUid":"merged-mvut9smb-15","sourceNo":545,"originalSourceNo":757,"displayNo":545,"vi":"Nhưng khi nào anh làm xong?","ko":"지연우: 근데 언제까지 해오실 건데요?","en":"But when will you get this done?","start":4049.93,"end":4052.08,"viStart":4076.537958,"viEnd":4081.08075,"koStart":4049.93,"koEnd":4052.08,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4076.537958,"end":4081.08075},"koRange":{"start":4049.93,"end":4052.08}},{"id":546,"sourceUid":"merged-mvut9n98-14","sourceNo":546,"originalSourceNo":758,"displayNo":546,"vi":"Tôi định hoàn thành việc thẩm định hôm nay.","ko":"윤주노: 저는 오늘 실사 끝낼 거라서요.","en":"I plan to finish the due diligence today.","start":4052.61,"end":4055.06,"viStart":4081.08075,"viEnd":4083.96075,"koStart":4052.61,"koEnd":4055.06,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4081.08075,"end":4083.96075},"koRange":{"start":4052.61,"end":4055.06}},{"id":547,"sourceUid":"merged-mvutd7x2-2","sourceNo":547,"originalSourceNo":759,"displayNo":547,"vi":"Trong hôm nay.\nChúng tôi có 75% sự đồng ý của cư dân.","ko":"윤주노: 오늘까지요. 주민동의서 75% 동의받았습니다.","en":"By today.\nWe got 75% of the resident's consent.","start":4066.28,"end":4071.17,"viStart":4094.030083,"viEnd":4100.230083,"koStart":4066.28,"koEnd":4071.17,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4094.030083,"end":4100.230083},"koRange":{"start":4066.28,"end":4071.17}},{"id":548,"sourceUid":"merged-mvutdym6-3","sourceNo":548,"originalSourceNo":760,"displayNo":548,"vi":"Vậy anh chỉ làm điều này sau khi nhận được sự đồng ý thôi sao?","ko":"지연우: 그럼 받아놓고 그러신 거예요?","en":"Then did you just do this\nafter getting the consent?","start":4071.16,"end":4075.19,"viStart":4100.230083,"viEnd":4103.550083,"koStart":4071.16,"koEnd":4075.19,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4100.230083,"end":4103.550083},"koRange":{"start":4071.16,"end":4075.19}},{"id":549,"sourceUid":"merged-mvutemim-4","sourceNo":549,"originalSourceNo":761,"displayNo":549,"vi":"Không, chúng tôi vừa mới nhận được mẫu đơn đồng ý cuối cùng.\nPhó Chủ tịch đã rất cố gắng làm việc này.","ko":"윤주노: 아니요. 마지막 한 장은 방금 받았습니다. 부사장님이 애쓰셨더라고요.","en":"No, we just got the final consent form.\nThe VP worked really hard for it.","start":4075.24,"end":4081.29,"viStart":4103.550083,"viEnd":4110.640626,"koStart":4075.24,"koEnd":4081.29,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4103.550083,"end":4110.640626},"koRange":{"start":4075.24,"end":4081.29}},{"id":550,"sourceUid":"merged-mvuthoyv-7","sourceNo":550,"originalSourceNo":764,"displayNo":550,"vi":"Tổ trưởng Yoon,\nanh sẽ không thật sự đòi hỏi tất cả số đó, phải không?\n528 tỷ won?","ko":"지연우: 어. 팀장님, 진짜 다 받으실 건 아니죠?\n지연우: 5,280억","en":"Mr. Yun,\nyou won't actually ask for all that, right?\n528 billion won?","start":4090.06,"end":4103.6,"viStart":4125.293972,"viEnd":4133.438455,"koStart":4090.06,"koEnd":4103.6,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4125.293972,"end":4133.438455},"koRange":{"start":4090.06,"end":4103.6}},{"id":551,"sourceUid":"merged-mvuti1ar-8","sourceNo":551,"originalSourceNo":765,"displayNo":551,"vi":"Là 530 tỷ won.","ko":"윤주노: 5,300억인데요","en":"It's 530 billion won.","start":4103.35,"end":4106.12,"viStart":4133.438455,"viEnd":4136.227799,"koStart":4103.35,"koEnd":4106.12,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4133.438455,"end":4136.227799},"koRange":{"start":4103.35,"end":4106.12}},{"id":552,"sourceUid":"merged-mvutltl1-3","sourceNo":552,"originalSourceNo":767,"displayNo":552,"vi":"Tôi đang dùng tiền túi của mình cho việc này.\nNhưng chẳng phải anh được trả lương sao?\nSao anh lại làm đến mức này?","ko":"지연우: 저는 제 돈 들어가는 건데 팀장님은 월급 받는 거 아니에요?\n지연우: 아 진짜 왜 이렇게까지 하세요?","en":"I'm spending my own money on this.\nBut aren't you paid a salary?\nWhy are you taking it this far?","start":4110.51,"end":4116.939,"viStart":4136.227799,"viEnd":4146.467799,"koStart":4110.51,"koEnd":4116.939,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4136.227799,"end":4146.467799},"koRange":{"start":4110.51,"end":4116.939}},{"id":553,"sourceUid":"merged-mvutmsqw-4","sourceNo":553,"originalSourceNo":768,"displayNo":553,"vi":"Tôi cần cứu công ty của mình.","ko":"윤주노: 회사를 살려야 해서요","en":"I need to save my company.","start":4116.75,"end":4118.8,"viStart":4146.467799,"viEnd":4148.278466,"koStart":4116.75,"koEnd":4118.8,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4146.467799,"end":4148.278466},"koRange":{"start":4116.75,"end":4118.8}},{"id":554,"sourceUid":"merged-mvutnbuo-5","sourceNo":554,"originalSourceNo":769,"displayNo":554,"vi":"CEO đã hỏi tôi vì sao chúng tôi bán mảng Xây dựng.","ko":"윤주노: 대표님, 일전에 왜 건설을 파냐고 물으셨죠?","en":"CEO,\nyou asked me why we were selling Construction.","start":4120.029,"end":4123.979,"viStart":4148.278466,"viEnd":4154.905133,"koStart":4120.029,"koEnd":4123.979,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4148.278466,"end":4154.905133},"koRange":{"start":4120.029,"end":4123.979}},{"id":555,"sourceUid":"merged-mvutnx46-6","sourceNo":555,"originalSourceNo":770,"displayNo":555,"vi":"Đúng, tôi đã hỏi thế. Vậy thì sao?","ko":"지연우: 네, 물었어요. 왜요?","en":"Yes, I asked. What about it?","start":4126.41,"end":4129.319,"viStart":4154.905133,"viEnd":4159.015905,"koStart":4126.41,"koEnd":4129.319,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4154.905133,"end":4159.015905},"koRange":{"start":4126.41,"end":4129.319}},{"id":556,"sourceUid":"merged-mvutotd7-7","sourceNo":556,"originalSourceNo":771,"displayNo":556,"vi":"Tôi tin rằng nếu chúng tôi muốn cứu Sanin,\nchúng tôi phải bán thứ tốt nhất mà chúng tôi có.","ko":"윤주노: 제일 좋은 걸 팔아야 산인그룹이 산다고 생각하고 있습니다.","en":"I believe if we want to save Sanin,\nwe must sell the best thing we've got.","start":4129.51,"end":4133.66,"viStart":4159.015905,"viEnd":4163.553147,"koStart":4129.51,"koEnd":4133.66,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4159.015905,"end":4163.553147},"koRange":{"start":4129.51,"end":4133.66}},{"id":557,"sourceUid":"merged-mvutpis4-8","sourceNo":557,"originalSourceNo":772,"displayNo":557,"vi":"Đó là lý do...\nchúng tôi sẽ cho cô thứ đáng giá nhất.","ko":"윤주노: 그래서 정말 알짜를 드리는 거예요.","en":"That's why...\nwe're giving you the most valuable thing.","start":4134.27,"end":4137.399,"viStart":4163.553147,"viEnd":4167.507799,"koStart":4134.27,"koEnd":4137.399,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4163.553147,"end":4167.507799},"koRange":{"start":4134.27,"end":4137.399}},{"id":558,"sourceUid":"merged-mvutqth4-9","sourceNo":558,"originalSourceNo":773,"displayNo":558,"vi":"Vì thế,\nanh thật sự định yêu cầu tất cả số đó sao?","ko":"지연우: 그래서 진짜 다 받을 거냐고요.","en":"So...\nare you really going to ask for all of it?","start":4143.529,"end":4148.68,"viStart":4171.667799,"viEnd":4178.571799,"koStart":4143.529,"koEnd":4148.68,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4171.667799,"end":4178.571799},"koRange":{"start":4143.529,"end":4148.68}},{"id":559,"sourceUid":"merged-mvuttffg-10","sourceNo":559,"originalSourceNo":774,"displayNo":559,"vi":"Tôi có thể nói chuyện riêng với CEO không?","ko":"윤주노: 대표님이랑만 잠깐 얘기 나눌 수 있을까요?","en":"Could I talk to you alone?","start":4150.52,"end":4153.77,"viStart":4178.571799,"viEnd":4182.902,"koStart":4150.52,"koEnd":4153.77,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4178.571799,"end":4182.902},"koRange":{"start":4150.52,"end":4153.77}},{"id":560,"sourceUid":"merged-mvuz5mkg-2","sourceNo":560,"originalSourceNo":781,"displayNo":560,"vi":"Họ đã cố gắng hết sức,\nnhưng tôi không nghĩ họ có thể đạt được mức 9 nghìn tỷ won.\n8.5 nghìn tỷ won?\nCó vẻ họ đang thương lượng trong khoảng đó.\nĐược.\nAnh cũng biết mảng Xây dựng như đứa con đầu lòng của chúng ta vậy.\nTôi thật sự hy vọng đứa con đầu lòng này sẽ phát triển mạnh mẽ.\nĐúng không?","ko":"일을 썩었는데. 9조까지는 안 될 거 같더라고.\n9조까지는 안 될 거 같더라고.\n이동준: 구조까지는 안 될 것 같더라고\n송재식: 8조 5천?\n이동준: 그 정도 선에서 딜을 하는 모양이야.\n송재식: 안 그래도 건설은 우리한테 첫째 아이가\n송재식: 첫째가 잘 사야 할 겐데\n송재식: 그치?","en":"They tried their best,\nbut I don't think they can get to 9 trillion won.\n8.5 trillion won?\nIt seems they're negotiating around that range.\nAll right.\nYou know how... Construction is like our firstborn.\nI really hope our firstborn thrives.\nRight?","start":4155.569,"end":4191.99,"viStart":4182.902,"viEnd":4221.803797,"koStart":4155.569,"koEnd":4191.99,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4182.902,"end":4221.803797},"koRange":{"start":4155.569,"end":4191.99}},{"id":561,"sourceUid":"merged-mvuz6rx8-4","sourceNo":561,"originalSourceNo":784,"displayNo":561,"vi":"Tổ trưởng Yoon,\nanh sẽ không thật sự yêu cầu hết con số\n8.5299 nghìn tỷ won đấy chứ?","ko":"지연우: 팀장님\n지연우: 진짜 8조 5,299억\n지연우: 다 받으실 건 아니죠?","en":"Mr. Yun,\nyou won't actually ask for all of\n8.5299 trillion won, right?","start":4192.319,"end":4199.61,"viStart":4221.803797,"viEnd":4230.163797,"koStart":4192.319,"koEnd":4199.61,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4221.803797,"end":4230.163797},"koRange":{"start":4192.319,"end":4199.61}},{"id":562,"sourceUid":"merged-mvuz85yo-7","sourceNo":562,"originalSourceNo":788,"displayNo":562,"vi":"Thay vì 299 tỷ won, thì mua cho tôi một ngôi mộ đi.\nLàm vậy cũng sẽ tốt hơn cho Bium nữa.\nAnh đang nói gì vậy?\nMột ngôi mộ?","ko":"윤주노: 2,299억 대신 묘지 하나 사주세요\n윤주노: 그게 비움에게도 훨씬 좋을 겁니다\n지연우: 그게 무슨 소리예요?\n지연우: 묘지라니?","en":"Buy me a gravesite instead of 299 billion won.\nThat will be much better for Bium as well.\nWhat are you talking about?\nA gravesite?","start":4200.8,"end":4211.61,"viStart":4200.8,"viEnd":4211.61,"koStart":4200.8,"koEnd":4211.61,"hasViAudio":false,"hasKoAudio":true,"viRange":null,"koRange":{"start":4200.8,"end":4211.61}},{"id":563,"sourceUid":"merged-mvv3r3c8-4","sourceNo":563,"originalSourceNo":792,"displayNo":563,"vi":"Bium D&I đã mua lại Xây dựng Sanin.\nĐây là thương vụ M&A lớn nhất trong năm.\nThông qua thương vụ này, Bium D&I\nđược kỳ vọng sẽ nhảy vào lĩnh vực xây dựng chung cư.\nCòn tin tức liên quan đến Bium D&I, đúng không?","ko":"한기자: 비움 DNI가 산인건설을 인수했습니다\n한기자: 올해 가장 큰 M&A였는데요\n한기자: 비움DNI 관련해서 다른 소식도 있죠?","en":"Bium D&I has acquired Sanin Construction.\nIt was the biggest M&A of the year.\nThrough this acquisition, Bium D&I\nis expected to jump into the\napartment construction business.\nThere's more news regarding Bium D&I, right?","start":4211.48,"end":4225.13,"viStart":4240.995797,"viEnd":4254.37713,"koStart":4211.48,"koEnd":4225.13,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4240.995797,"end":4254.37713},"koRange":{"start":4211.48,"end":4225.13}},{"id":564,"sourceUid":"merged-mvv3tn8n-9","sourceNo":564,"originalSourceNo":796,"displayNo":564,"vi":"Đúng, đây là một câu chuyện ấm lòng.\nHọ đã giải quyết một vấn đề tái phát triển bị đình trệ\ndưới thời Xây dựng Sanin trong quá trình mua lại này.\nĐó là vấn đề gì vậy?\nMột cư dân đã đào một chỗ chôn cất sau khu chung cư.\nCư dân đó là một bà lão,\nvà đó là nơi chôn cất của người chồng quá cố của bà.\nChuyện đó hẳn là phạm pháp, đúng không?","ko":"한기자: 네요. 비움DNI는 이를 통해 아파트 건설에 본격적으로 뛰어들 전망입니다.\n한기자: 네. 훈훈한 소식인데요. 산인건설에서 진행하다가 막혔던 재건축 사업을 비움DNI가 인수하면서 해결했습니다.\n한기자: 어떤 문제였습니까?\n한기자: 주민 아파트 뒷산에 묘를 썼던 겁니다. 주민분이 할머니신데요. 그 내에분 할아버지의 묘였습니다.\n한기자: 불법이죠 아마?","en":"Yes, it's a heartwarming story.\nThey resolved a redevelopment issue that stalled\nunder Sanin Construction during the acquisition.\nWhat was the issue?\nA resident dug a gravesite behind the apartment.\nThat resident was an elderly lady,\nand it was her late husband's gravesite.\nThat's probably illegal, right?","start":4216.72,"end":4244.07,"viStart":4254.37713,"viEnd":4274.638464,"koStart":4216.72,"koEnd":4244.07,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4254.37713,"end":4274.638464},"koRange":{"start":4216.72,"end":4244.07}},{"id":565,"sourceUid":"merged-mvv3v8o1-11","sourceNo":565,"originalSourceNo":799,"displayNo":565,"vi":"Vâng. Thêm nữa, họ không phải là một cặp vợ chồng hợp pháp,\nnên bà ấy không thể có quyền tái phát triển.\nVà chủ sở hữu đất trước đây là Xây dựng Sanin,\nvà giờ là Bium D&I.\nVậy chuyện gì đã xảy ra?","ko":"한기자: 네, 또 법적으로 부부가 아니기도 해서요. 재건축에 대한 권리를 못 받을 수도 있었습니다.\n한기자: 땅의 소유주도 산인건설, 이제는 비움DNI겠고요.\n한기자: 그런데요?","en":"Yes. Also, they weren't legally a married couple,\nso she could not have had redevelopment rights.\nAnd the land owner was Sanin Construction,\nand it is now Bium D&I.\nAnd what happened?","start":4243.82,"end":4256.13,"viStart":4274.638464,"viEnd":4286.641144,"koStart":4243.82,"koEnd":4256.13,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4274.638464,"end":4286.641144},"koRange":{"start":4243.82,"end":4256.13}},{"id":566,"sourceUid":"merged-mvv3xj7s-13","sourceNo":566,"originalSourceNo":800,"displayNo":566,"vi":"Nhưng Bium D&I đã di dời mộ của ông cụ về quê\nvà cũng công nhận quyền tái phát triển của bà.\nKết quả là, họ đã tiến hành tái phát triển.","ko":"한기자: 하지만 비움DNI가 할아버지의 묘를 고향으로 이장해드리고 또 재건축에 대한 권리도 인정해주면서 재건축을 진행하게 되었습니다.","en":"But Bium D&I relocated the grandfather's grave to his hometown\nand also recognized her redevelopment rights.\nAs a result, they proceeded with the redevelopment.","start":4256.28,"end":4265.27,"viStart":4286.641144,"viEnd":4294.886464,"koStart":4256.28,"koEnd":4265.27,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4286.641144,"end":4294.886464},"koRange":{"start":4256.28,"end":4265.27}},{"id":567,"sourceUid":"merged-mvv3y3l6-14","sourceNo":567,"originalSourceNo":801,"displayNo":567,"vi":"Các thương vụ M&A thường được gọi là cuộc chiến không vũ khí,\nnhưng đây là một câu chuyện ấm lòng từ chiến trường.","ko":"한기자: M&A가 총칼 없는 전쟁이라고 불리는데요. 전장에서도 훈훈한 소식이네요.","en":"M&A is often called a war without weapons,\nbut this is a heartwarming from the battlefield.","start":4265.92,"end":4271.29,"viStart":4294.886464,"viEnd":4301.064798,"koStart":4265.92,"koEnd":4271.29,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4294.886464,"end":4301.064798},"koRange":{"start":4265.92,"end":4271.29}},{"id":568,"sourceUid":"merged-mvv3z3nr-15","sourceNo":568,"originalSourceNo":802,"displayNo":568,"vi":"Vâng. Đây là lần đầu tiên tôi nghe được\nmột câu chuyện ấm lòng như vậy khi đưa tin về kinh tế.","ko":"한기자: 경제 뉴스를 하면서 이렇게 따뜻한 뉴스는 저도 처음입니다","en":"Yes. This is the first time I've heard of\nsuch a heartwarming story while covering economic news.","start":4271.04,"end":4275.61,"viStart":4301.064798,"viEnd":4305.334464,"koStart":4271.04,"koEnd":4275.61,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4301.064798,"end":4305.334464},"koRange":{"start":4271.04,"end":4275.61}},{"id":569,"sourceUid":"merged-mvv4ha08-16","sourceNo":569,"originalSourceNo":803,"displayNo":569,"vi":"Giờ chúng ta cùng xem buổi phỏng vấn CEO của Bium D&I.","ko":"한기자: 자 그럼 비움 D&I 대표님의 인터뷰를 보시죠","en":"Let's watch the interview with the CEO of BIum D&I.","start":4275.36,"end":4280.35,"viStart":4305.334464,"viEnd":4309.923797,"koStart":4275.36,"koEnd":4280.35,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4305.334464,"end":4309.923797},"koRange":{"start":4275.36,"end":4280.35}},{"id":570,"sourceUid":"merged-mvv4ho54-17","sourceNo":570,"originalSourceNo":804,"displayNo":570,"vi":"Phương châm của Bium D&I không chỉ đơn thuần là xây dựng những căn hộ tốt,","ko":"지연우: 저희 비움 D&I는 단순히 살기 좋은 아파트가 아니라","en":"Bium D&I's motto\nisn't just about building good apartments,","start":4280.1,"end":4284.61,"viStart":4309.923797,"viEnd":4314.128969,"koStart":4280.1,"koEnd":4284.61,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4309.923797,"end":4314.128969},"koRange":{"start":4280.1,"end":4284.61}},{"id":571,"sourceUid":"merged-mvv4il89-18","sourceNo":571,"originalSourceNo":805,"displayNo":571,"vi":"mà còn là tạo ra những mái ấm\nnơi mọi người có thể sống một cách đường hoàng.","ko":"지연우: 사람이 사는 사람다운 주거지를 모토로 하고 있습니다","en":"but to create homes\nwhere people can live with dignity.","start":4284.36,"end":4288.09,"viStart":4314.128969,"viEnd":4317.659798,"koStart":4284.36,"koEnd":4288.09,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4314.128969,"end":4317.659798},"koRange":{"start":4284.36,"end":4288.09}},{"id":572,"sourceUid":"merged-mvv4pcuy-20","sourceNo":572,"originalSourceNo":807,"displayNo":572,"vi":"Chúng tôi sẽ nỗ lực để cải thiện môi trường cư trú của Hàn Quốc,\ntạo ra những ngôi nh to a good place like this,","start":4314.38,"end":4323.47,"viStart":4341.753131,"viEnd":4352.425131,"koStart":4314.38,"koEnd":4323.47,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4341.753131,"end":4352.425131},"koRange":{"start":4314.38,"end":4323.47}},{"id":577,"sourceUid":"merged-mvv4rr35-26","sourceNo":577,"originalSourceNo":813,"displayNo":577,"vi":"nên sau này gặp lại\nông phải khen tôi đẹp đấy nhé.","ko":"서춘년: 나중에 만나면 이쁘다 해줘요.","en":"you should call me pretty\nwhen we meet again later.","start":4324.4,"end":4328.63,"viStart":4352.425131,"viEnd":4358.632307,"koStart":4324.4,"koEnd":4328.63,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4352.425131,"end":4358.632307},"koRange":{"start":4324.4,"end":4328.63}},{"id":579,"sourceUid":"merged-mvv4s222-27","sourceNo":579,"originalSourceNo":814,"displayNo":579,"vi":"Cảm ơn mọi người.","ko":"서춘년: 고맙소.","en":"Thank you.","start":4352.23,"end":4353.38,"viStart":4373.752624,"viEnd":4384.328393,"koStart":4352.23,"koEnd":4353.38,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4373.752624,"end":4384.328393},"koRange":{"start":4352.23,"end":4353.38}},{"id":581,"sourceUid":"merged-mvv4t0hc-28","sourceNo":581,"originalSourceNo":815,"displayNo":581,"vi":"Tôi xin gửi lời cảm ơn đến tất cả mọi người\nđã tham dự buổi tiệc bế mạc của Tập đoàn Sanin và Bium D&I.","ko":"강상배: 사림그룹과 비운 D&I의 클로징을 축하하는 파티에 오신 걸 여러분들께 감사드립니다.","en":"I'd like to thank everyone who attended\nthe closing party for Sanin Group and Bium D&I.","start":4356.2,"end":4363.91,"viStart":4384.328393,"viEnd":4393.761192,"koStart":4356.2,"koEnd":4363.91,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4384.328393,"end":4393.761192},"koRange":{"start":4356.2,"end":4363.91}},{"id":582,"sourceUid":"merged-mvv4utjh-31","sourceNo":582,"originalSourceNo":816,"displayNo":582,"vi":"Đặc biệt, tôi rất muốn nghe chia sẻ từ Giám đốc Ha,\nngười đã làm việc vất vả nhất cho hợp đồng này.","ko":"강상배: 누구보다 대하게 애써주신 하태수 전무님의 소회가 궁금한데요.","en":"I'm especially curious to hear from\nDirector Ha, who worked hardest on the contract.","start":4364.9,"end":4370.45,"viStart":4393.761192,"viEnd":4399.899949,"koStart":4364.9,"koEnd":4370.45,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4393.761192,"end":4399.899949},"koRange":{"start":4364.9,"end":4370.45}},{"id":583,"sourceUid":"merged-mvv4ul4s-30","sourceNo":583,"originalSourceNo":817,"displayNo":583,"vi":"Xin hãy dành một tràng pháo tay chào đón anh ấy.","ko":"강상배: 박수로 맞이하겠습니다.","en":"Let's welcome him with a round of applause.","start":4370.98,"end":4372.35,"viStart":4399.899949,"viEnd":4403.280393,"koStart":4370.98,"koEnd":4372.35,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4399.899949,"end":4403.280393},"koRange":{"start":4370.98,"end":4372.35}},{"id":584,"sourceUid":"merged-mvv4v8gc-32","sourceNo":584,"originalSourceNo":818,"displayNo":584,"vi":"Cảm ơn mọi người.","ko":"하태수: 네, 감사합니다.","en":"Thank you.","start":4386.58,"end":4387.17,"viStart":4414.691059,"viEnd":4417.240393,"koStart":4386.58,"koEnd":4387.17,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4414.691059,"end":4417.240393},"koRange":{"start":4386.58,"end":4387.17}},{"id":585,"sourceUid":"merged-mvv52y8p-3","sourceNo":585,"originalSourceNo":822,"displayNo":585,"vi":"Xây dựng Sanin là công ty tốt nhất Hàn Quốc,\nnhưng tôi tin nó sẽ trở thành công ty tốt nhất thế giới.\nVà...\nVâng, cảm ơn mọi người.\nChính vì niềm tin đó mà tôi đã có thể chốt thành công thương vụ này.","ko":"하태수: 지금까지 우리 산인건설은 한국에서 최고였지만\n하태수: 앞으로는 세계 최고가 될 거라고 믿습니다.\n하태수: 그리고... 아, 네, 감사합니다.\n하태수: 그리고 그 믿음이 있었기에 이번 딜을 성공적으로 이끌 수 있었습니다.","en":"Sanin Construction was the best in Korea,\nbut I believe it'll become the best in the world.\nAnd...\nYes, thank you.\nIt was because of that belief\nthat I was able to successfully close this deal.","start":4388.62,"end":4405.19,"viStart":4417.240393,"viEnd":4433.339059,"koStart":4388.62,"koEnd":4405.19,"hasViAudio":true,"hasKoAudio":true,"viRange":{"start":4417.240393,"end":4433   arr.forEach((it,idx)=>{const rg=audioRange(it,side),div=document.createElement('div'),isMatched=state.matched.has(it.id);const audioOnly=side==='left'&&it.audioOnlyLeft;div.className='item '+(idx===sel?'selected ':'')+(isMatched?'good dim ':'')+(!audioOnly&&isKo(it[side])?'ko':'');const mainText=audioOnly?'<span class="audioBadge '+rg.lang+'">Audio cue</span>':esc(clean(it[side]));div.innerHTML=(side==='left'?'<span class="num">'+String(idx+1).padStart(2,'0')+'.</span>':'')+mainText+'<div class="meta">'+fmt(rg.start)+' → '+fmt(rg.end)+' · <span class="audioBadge '+rg.lang+'">'+rg.label+'</span></div>';const btn=document.createElement('button');btn.className='listenBtn '+rg.lang;btn.type='button';btn.textContent=rg.lang==='readko'?'Read KO':'Nghe';btn.onclick=(ev)=>{ev.stopPropagation();playSegment(it,side)};const meta=div.querySelector('.meta');if(meta)meta.appendChild(btn);div.onclick=()=>{if(side==='left')state.leftSel=idx;else state.rightSel=idx;render()};el.appendChild(div)})
}
function selected(side){const idx=side==='left'?state.leftSel:state.rightSel;if(idx===null||idx===undefined)return null;return side==='left'?state.left[idx]:state.right[idx]}
function match(){const l=selected('left'),r=selected('right');if(!l||!r)return setStatus('Bạn cần chọn 1 câu bên trái và 1 câu bên phải.');if(l.id===r.id){state.matched.add(l.id);setStatus('Đúng rồi! Điểm: <strong>'+state.matched.size+'/'+state.pairs.length+'</strong>')}else{setStatus('Chưa đúng. Thử lại nhé.')}render()}
function playSegment(item,side){if(!item)return setStatus('Bạn chưa chọn câu.');const rg=audioRange(item,side);if(rg.lang==='readko'){readKoText(item.ko,side==='left'?'Read KO bên trái':'Read KO bên phải');return}const a=audioEl(rg.lang);if(!a.src){if(item.ko)return readKoText(item.ko,'Không có audio, chuyển sang Read KO');return setStatus('Bạn chưa nạp audio '+rg.label+'.')}stopAudio();applyGameVolume(rg.lang);const off=parseFloat($('offset').value||0)||0;state.audioMode='segment';state.segmentEnd=Math.max(0,rg.end+off);a.currentTime=Math.max(0,rg.start+off+0.01);a.play().catch(()=>setStatus('Cần bấm Play trên audio một lần.'));setStatus('Đang nghe '+(side==='left'?'trái':'phải')+': '+fmt(rg.start)+' → '+fmt(rg.end)+' · '+rg.label)}
function playAudioRangePromise(rg){return new Promise(resolve=>{const a=audioEl(rg.lang);if(!a||!a.src){resolve();return}const off=parseFloat($('offset').value||0)||0;const end=Math.max(0,rg.end+off);let done=false;const cleanup=()=>{if(done)return;done=true;clearInterval(timer);resolve()};const timer=setInterval(()=>{if(state.audioMode!=='roundseq'){cleanup();return}if(a.currentTime>=end){a.pause();cleanup()}},80);applyGameVolume(rg.lang);a.currentTime=Math.max(0,rg.start+off+0.01);a.play().catch(()=>cleanup())})}
async function playRound(){if(!state.left.length)return;const side='left', items=state.left.map(x=>({...x,_rg:audioRange(x,side)})).sort((a,b)=>a._rg.start-b._rg.start);stopAudio();state.audioMode='roundseq';setStatus('Đang nghe/Read KO cả lượt: '+items.length+' câu.');for(const it of items){if(state.audioMode!=='roundseq')break;const rg=audioRange(it,side);setStatus((rg.lang==='readko'?'Read KO':'Nghe')+' cả lượt: '+(items.indexOf(it)+1)+'/'+items.length+' · '+rg.label);if(rg.lang==='readko'){await readKoPromise(it.ko)}else{await playAudioRangePromise(rg)}await new Promise(r=>setTimeout(r,180))}if(state.audioMode==='roundseq'){state.audioMode='free';setStatus('Đã nghe/Read KO xong cả lượt.')}}
function syncAudioGuard(){['vi','ko'].forEach(k=>{const a=audioEl(k);if(!a.src||a.paused)return;if(state.audioMode==='segment'&&state.segmentEnd!==null&&a.currentTime>=state.segmentEnd){a.pause();state.audioMode='free';setStatus('Đã nghe xong câu đang chọn.')}if(state.audioMode==='round'&&state.roundEnd!==null&&a.currentTime>=state.roundEnd){a.pause();state.audioMode='free';setStatus('Đã nghe xong audio cả lượt.')}})}
function showAnswer(){const left=selected('left');if(!left)return setStatus('Chọn một câu bên trái trước.');state.rightSel=state.right.findIndex(x=>x.id===left.id);render();setStatus('Đã chọn đáp án bên phải.')}
$('gameJsonFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());loadGameProject(data,false)}catch(err){setStatus('Không đọc được JSON dự phòng: '+(err&&err.message?err.message:err))}};
$('viFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(state.audioUrl.vi)URL.revokeObjectURL(state.audioUrl.vi);state.audioUrl.vi=URL.createObjectURL(f);$('viAudio').src=state.audioUrl.vi;try{$('viAudio').load()}catch(e){}applyGameVolume('vi');setStatus('Đã nạp VI Dub từ file máy.')};
$('koFile').onchange=e=>{const f=e.target.files[0];if(!f)return;if(state.audioUrl.ko)URL.revokeObjectURL(state.audioUrl.ko);state.audioUrl.ko=URL.createObjectURL(f);$('koAudio').src=state.audioUrl.ko;try{$('koAudio').load()}catch(e){}applyGameVolume('ko');setStatus('Đã nạp KO Live từ file máy.')};
['mode','direction','pickMode','startMode','audioPromptLang'].forEach(id=>$(id).onchange=()=>newRound());
$('newRoundBtn').onclick=newRound;$('matchBtn').onclick=match;$('playLeftBtn').onclick=()=>playSegment(selected('left'),'left');$('playRightBtn').onclick=()=>playSegment(selected('right'),'right');$('playRoundBtn').onclick=playRound;$('stopBtn').onclick=()=>{stopAudio();setStatus('Đã dừng.')};
$('fNew').onclick=newRound;$('fMatch').onclick=match;$('fLeft').onclick=()=>playSegment(selected('left'),'left');$('fRight').onclick=()=>playSegment(selected('right'),'right');$('fRound').onclick=playRound;$('fStop').onclick=()=>{stopAudio();setStatus('Đã dừng.')};$('fAnswer').onclick=showAnswer;
$('fontSize').oninput=e=>{document.documentElement.style.setProperty('--font-size',e.target.value+'px');$('fontLabel').textContent=e.target.value+' px'};$('offset').oninput=e=>$('offsetLabel').textContent=Number(e.target.value).toFixed(1)+'s';$('startCue').onchange=()=>{if($('pickMode').value!=='fromcue')$('pickMode').value='fromcue';newRound()};
['vi','ko'].forEach(k=>audioEl(k).addEventListener('timeupdate',syncAudioGuard));
initVolumeControls();
loadGameProject(project,true);
autoLoadGithubAudio();
</script>
</body>
